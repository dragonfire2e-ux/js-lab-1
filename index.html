<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CCT 360 - JavaScript Assignment</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>CCT 360 - Interactive Webpage</h1>
  <p class="intro">Click each button to see what I did with js.</p>

  <!-- The element that will change -->
  <div id="box">
    <p id="message">Hello! This is the original text.</p>
  </div>

  <!-- Event 1 change the content (DOM) -->
  <button onclick="changeText()">1. Change the text</button>

  <!-- Event 2 change the styling (DOM) -->
  <button onclick="changeStyle()">2. Change the style</button>

  <!-- Event 3 open a pop-up window (BOM) -->
  <button onclick="openPopup()">3. Open a pop-up</button>

  <script src="js/script.js"></script>
</body>
</html>
